# Default configuration (Issue #1). Match constants are the published BAR-ATH values
# (DATA.md); they are cross-checked against games.py at load time.
team_name: "Opus Operandi"
seed: 0

match:
  game: BAR-ATH
  n_video_frames: 199319
  fps: 25
  pitch: [105.3, 68.0]          # metres (length, width)
  half1: [11185, 90651]         # graded, ball alive/dead
  half2_dead: [110808, 113741]  # graded, ball dead 100% -> forced D
  half2_play: [113742, 190197]  # graded, from the centre kick-off to the final whistle

# Macroscopic sanity ALARMS, not targets: wide ranges from generic football priors.
# They must never be used to choose hyper-parameters (EVALUATION.md).
kpi_alarms:
  possessions: [150, 600]           # number of H/A spells
  mean_duration_s: [5.0, 30.0]      # mean possession duration, seconds
  dead_pct_of_graded: [15.0, 55.0]  # % of D over graded frames (external matches: 29-52%)
  home_pct_of_alive: [35.0, 75.0]   # % of H over alive (H+A) frames

# Issue #27 -- thresholds of the KPI dashboard.  The KPI targets are quality gates reported as OK / WARN; they
# are never used to choose hyper-parameters (and the public 5 minutes only run as a pipeline check).
kpi_dashboard:
  blindness_minutes: 20.0       # KPI 2: first graded minutes of the target match
  blindness_hide_frac: 0.41     # KPI 2: share of the alive frames hidden in extra synthetic blocks
  blindness_seed: 0
  blindness_target: 0.75        # KPI 2: spellF1 masked-vs-unmasked self-consistency
  external_spell_target: 0.65   # KPI 3: mean spellF1 on the degraded external matches
  latency_target_frames: 8.0    # KPI 3: median absolute transition latency
  latency_match_window_s: 5.0   # KPI 3: predicted transitions farther than this from a true one are unmatched
  external_seeds: [0]           # KPI 3: degrader seeds
  bootstrap_n: 200              # KPI 4: block-bootstrap draws of the interval on the public 5 minutes
  audit_n: 20                   # KPI 5: transitions exported for the visual audit
  route_margin_spellf1: 0.04    # KPI 7: leave-one-match-out gain needed to prefer the specialists (spellF1 noise)
  external_evidence: reports/external_evidence.json   # KPI 7: committed external LOMO evidence (used without --external-lomo)
  evidence_setting: degraded    # setting of that file the decision reads

# Issue #13 -- continuous dead-ball (D) signals. Defaults are generic football priors; they are
# meant to be tuned on external matches only (never on the public 5 minutes of BAR-ATH).
dead_ball_signals:
  out_margin_m: 0.3            # ball counts as out of bounds beyond the lines by more than this
  still_speed_mps: 0.4         # ball "stationary" below this speed
  still_ref_s: 2.0             # stationary time that saturates the still signal
  walk_speed_mps: 1.7          # a player "walks" below this speed
  min_active_players: 6        # fewer valid players -> player-speed features are NaN
  speed_smooth_s: 1.0          # moving-average window for the speed terms of dead_score
  visibility_cap_s: 60.0       # cap of time-since / time-to ball visibility
  ball_speed_half_span: 2      # frames each side when the ball speed is derived from positions
  player_speed_half_span: 1
  corner_radius_m: 2.0         # ball within this distance of a corner flag
  goal_area_depth_m: 6.0       # 6-yard box depth (5.5 m) plus tracking tolerance
  goal_area_half_width_m: 9.7  # 6-yard box half width (9.16 m) plus tolerance
  centre_radius_m: 1.5         # ball near the centre spot
  kickoff_own_half_tol_m: 1.0  # players may stand this far past the halfway line
  kickoff_min_fraction: 0.85   # share of active players of each team inside their own half
  kickoff_min_players: 5
  touchline_margin_m: 1.5      # ball this close to a touchline (and not in a corner)
  status_channels: [status, ball_status, ballstatus, alive, ball_alive, ballalive, dead, ball_dead, state]
  # dead_score = logistic(bias + sum(w_i * signal_i)); bias_no_ball replaces bias when the ball is missing
  bias: -3.5
  bias_no_ball: -3.0
  w_out: 4.0
  w_still: 3.0
  w_slow: 2.0
  w_walk: 2.5
  w_geom: 1.5
  w_status: 6.0
  speed_ref_mps: 2.5           # mean player speed at which the "slow" signal reaches zero

# Issue #14 -- exact restart frame t* inside Smart Tagging SET PIECES windows and after GOALS.
setpiece_anchor:
  pre_margin_s: 1.0             # search window = [start - pre, end + post] around the tag interval
  post_margin_s: 2.0
  rest_speed_mps: 1.0           # ball at rest below this speed
  launch_speed_mps: 4.0         # ball launched above this speed
  launch_sustain_frames: 3      # launch speed must hold this many frames
  min_rest_s: 0.4               # minimum rest immediately before the launch
  rest_cap_s: 5.0               # rest longer than this does not add confidence/selection weight
  max_ramp_s: 0.5               # t* is at most this far before the launch crossing
  ball_speed_half_span: 2       # frames each side when the ball speed is derived from positions
  player_speed_half_span: 1
  collective_window_s: 1.0      # windows before/after for the collective speed jump
  collective_jump_min_mps: 0.4  # minimum rise of the mean player speed
  collective_conf_max: 0.5      # confidence ceiling of the collective method
  collective_dead_lag_s: 1.0     # Issue #40: the speed jump must follow dead evidence within this lag (0 = off); external
                                # pseudo-window check: mean |t* error| 208->126 (IDSSE), 247->181 (PFF), 259->143 (Metrica) frames
  dead_threshold: 0.5           # dead_score above this counts as dead-ball evidence
  dead_gap_close_s: 1.0         # evidence gaps shorter than this are bridged
  dead_tail_s: 1.0              # evidence may end this long before t*
  max_dead_back_s: 40.0         # D onset is searched at most this far before t*
  goal_search_pre_s: 3.0        # the goal's dead onset is searched in [start - pre, end + post]
  goal_search_post_s: 6.0
  max_goal_to_kickoff_s: 150.0  # a Kick Off (After Goal) farther than this is not linked to the goal
  restart_mask_halfwidth: 0     # restart_mask is True on t* +- this many frames
  fallback_dead_s: 0.5          # Issue #50: no dead-score evidence -> force D only this long right before t* (0 = never force)
  fallback_tag_window: false    # Issue #50: true = legacy, force D back to the tag-window start (the 35 s windows open in live play)
  clamp_period_starts: true     # Issue #50: Kick Off (Start) t* -> first frame of its play block (config / games.py constants)
  offset_prior: false           # Issue #49: collective-cue search restricted to the t* - tag_start band learned from the ball-method anchors
  offset_prior_min_n: 3
  offset_prior_quantiles: [0.05, 0.95]
  offset_prior_margin_s: 1.0

# Issue #16 -- ball-to-player distances, control weights, touches and the possession evidence.
ball_kinematics:
  k_nearest: 3
  control_sigma_m: 2.0          # distance scale of the control weight
  control_tau_mps: 10.0         # relative-speed scale of the control weight
  touch_accel_mps2: 12.0        # |a_ball| peak threshold
  touch_angle_deg: 35.0         # direction-change threshold
  touch_angle_half_span: 2      # frames each side for the before/after velocity
  touch_min_speed_mps: 1.0      # direction is undefined below this ball speed
  touch_distance_m: 1.8         # a player must be this close to the ball at the peak
  touch_gate_halfwidth: 2       # ... within +- this many frames
  touch_peak_halfwidth: 3       # peak = local maximum within +- this many frames
  evidence_smooth_s: 0.6        # moving-average window of possession_evidence
  evidence_dist_scale_m: 2.0    # tanh scale of the distance-gap term
  evidence_control_weight: 0.5  # share of the control-difference term (rest: distance-gap term)

# Issue #23 -- time-dependent log transition matrix log A_t[i, j] (states H=0, A=1, D=2).  Log-values;
# staying in a state costs `stay`.  Generic priors, to be tuned on external matches only.
transition_matrix:
  stay: 0.0
  ha_closed: -11.5              # H<->A at rest
  ha_open: -1.4                 # H<->A inside a contested-touch window
  touch_halfwidth: 5            # window = touch peak +- this many frames
  touch_min_score: 0.5          # touch_score at or above this is a touch peak
  touch_both_dist_m: 2.0        # the gaining team must have a player this close to the ball at the touch
  require_both_teams: false     # true: stricter 'contested touch' (both teams this close)
  touch_gate_halfwidth: 2       # ... within +- this many frames of the peak
  ha_occluded: -6.0             # H<->A while the ball has been missing for a long time
  occlusion_min_s: 2.0          # a missing-ball run at least this long counts as an occlusion
  occlusion_margin_frames: 5    # the occlusion window extends this far past the run on both sides
  dead_closed: -8.0             # H/A -> D without dead-ball evidence
  dead_open: -1.5               # H/A -> D with strong evidence (dead_score high or ball out)
  dead_ramp: [0.3, 0.7]         # smoothed dead_score at which the entry starts / is fully open
  dead_smooth_s: 0.4
  d_exit_closed: -9.0           # D -> H/A away from restarts while dead evidence persists
  d_exit_open: -2.0             # D -> H/A once the dead evidence has dropped
  alive_ramp: [0.5, 0.9]        # smoothed (1 - dead_score) at which the exit starts / is fully open
  restart_open: -1.0            # D -> restart team around a restart frame t*
  restart_halfwidth: 3          # window = t* +- this many frames
  restart_other_team: -3.0      # extra log-penalty for the other team when the restart team is known
  restart_team_before_s: 0.0    # Issue #49: the penalty also holds from t* - before ... (0 = only t* +- restart_halfwidth)
  restart_team_after_s: 0.0     # ... to t* + after
  phase_cue: false              # Issue #43: open H<->A around Smart Tagging Attacking / Defensive Transition starts
  phase_cue_open: -4.0          # ... to this log-value (towards the team that gains the ball)
  phase_cue_before_s: 4.0
  phase_cue_after_s: 8.0
  phase_cue_hidden_only: true   # ... only inside occlusions
  learned_gate_mode: "off"      # Issue #57: off | hard | blend | max -- gate H<->A with Specialist C (models/specialist_c.json)
  learned_gate_threshold: 0.5   # hard: gate open where P_C >= this
  learned_gate_blend: 0.5       # blend: g = blend * rule + (1 - blend) * P_C

# Issue #57 -- Specialist C (learned H<->A turnover gate): training settings (external matches only).
specialist_c:
  half_window: 5
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 15
  min_child_samples: 40
  subsample: 0.8
  colsample: 0.7
  reg_lambda: 5.0
  calib_folds: 0                # the temperature fitted on the first model was 0.99: no calibration
  pff_weight: 0.5

# Issue #72 -- sequence model (TCN over the specialists' feature matrix); trained on external matches only
# (scripts/train_sequence.py), NumPy inference from models/sequence_tcn.json (mean softmax of two training seeds).
# ADOPTED (E100): hidden-ball emissions, weight 1.0; Issue #73 V50s: + visible-frame emissions (weight 0.5, scale 0.8).  Fallback = the pre-#72 route: enabled: false (SHA256 cac8927c...).
# mode: emissions (hidden-ball frames only) | turnover (opens the H<->A transition through #57's gate) | both.
sequence_model:
  enabled: true
  mode: "emissions"
  emission_weight: 1.0
  emission_scale: 0.8           # Issue #73: tempering of the TCN log-probs in all mixed frames (was 0.5)
  visible_weight: 0.5           # Issue #73: same log-linear mix on ball-visible frames (0 = #72 behaviour)
  prob_floor: 0.001
  turnover_gate_mode: "max"     # hard | max | blend
  turnover_threshold: 0.5
  turnover_blend: 0.5
  half_window: 5
  crf_transition: false         # Issue #78 (C2): learned H<->A transitions replace the production ones (needs a CRF-trained model)

# Issue #80 -- per-player possession zones with duel and control rules (features/player_possession.py).  Measured on the
# external benchmarks and left OFF unless the adoption rule is met (docs/TECHNICAL_REPORT.md).
player_possession:
  enabled: false
  usage: "emission"             # emission | transition | both
  radius_m: 1.5                 # possession zone radius R
  confirm_s: 0.8                # control confirmed after C s of the same team alone in the zone (or two same-team touches)
  emission_weight: 0.5          # weight of the log-odds of the controlling team added to the H/A emissions
  confidence: 0.8               # P behind that log-odds (fixed a priori)
  touch_min_score: 0.7
  touch_pair_max_s: 3.0
  bridge_frames: 3
  opening_halfwidth: 7          # frames around a change of confirmed control where H<->A opens to ha_open

# Issue #24 -- Viterbi decoding of each graded block.
viterbi:
  log_init: [-0.6931, -0.6931, -3.0]   # log-prior of the first frame of a block: H, A, D
  round_decimals: 6                    # log_probs are rounded to this many decimals before decoding

# Issue #34 -- explicit-duration (semi-Markov) decoder.  Per-state duration histograms (H / A possessions, D
# stoppages) are fitted on the ground-truth labels of the external training matches only and stored with the
# specialists (models/specialists.json); the decoder combines them with the transition matrix A_t and the
# emissions.  Measured on the 7 degraded IDSSE matches (leave-one-match-out) and kept OFF unless it passes the
# adoption rule (see docs/TECHNICAL_REPORT.md 5.x).
duration:
  enabled: false
  weight: 1.0                   # multiplier of the duration log-probabilities
  center: true                  # subtract the mean log-pmf: an average segment costs nothing extra
  apply_to_heuristic: false     # the heuristic route as well (needs a table)
  alpha: 0.5                    # additive smoothing of the histogram bins
  min_tail_runs: 5
  default_tail_excess_s: 30.0

# Issue #62 -- decoding by expected spellF1: k posterior paths (forward-backward, backward sampling, fixed seed) plus
# the Viterbi path; the one with the highest mean spellF1 against the others wins.  Kept OFF unless adopted.
expected_spellf1:
  enabled: false
  k: 100
  temperature: 1.0              # sampling temperature (> 1 flattens the posterior)
  seed: 0

# Issue #25 -- spellF1-oriented post-processing of the decoded labels (never crosses a graded block).
spell_optimizer:
  micro_poss_s: 1.2             # H->A->H / A->H->A middle runs shorter than this are absorbed ...
  keep_min_visible_frac: 0.5    # ... unless the ball is visible this share of the run ...
  keep_min_touches: 2           # ... and there are at least this many touch peaks (a double touch)
  touch_min_score: 0.5          # touch_score at or above this is a touch peak
  touch_pad_frames: 3           # peaks are counted in the run +- this many frames
  min_dead_s: 0.6               # D runs shorter than this (and not forced) are absorbed
  min_isolated_poss_s: 0.8      # an H/A run squeezed between two D runs and shorter than this becomes D
  bridge_min_poss_s: 25.0       # long same-team possessions may receive a D bridge ...
  bridge_min_dead_s: 4.0        # ... over a dead-evidence valley at least this long ...
  bridge_dead_threshold: 0.6    # ... where the smoothed dead_score is at least this ...
  bridge_gap_close_s: 1.0       # ... bridging evidence gaps shorter than this ...
  bridge_requires_geometry: true  # ... and there is touchline / set-piece / out-of-play support

# Issue #61 -- post-Viterbi refinement of each boundary to the touch peak of the gaining team (H<->A) or to the
# restart frame t* (D->alive) within +-window_frames.  Off: not adopted unless the #61 rule is met.
boundary_snap:
  enabled: false
  window_frames: 12
  snap_ha: true
  snap_restart: true

# Issue #28 (wave 1) -- heuristic emissions log_probs[N, 3] (H, A, D) from the #13 / #16 features.
# Generic priors; to be tuned on external matches only.
heuristic_emissions:
  w_evidence: 0.5               # logit of H vs A per unit of possession_evidence (in [-1, 1]); weak term
  w_phase: 0.3                  # weak Smart Tagging phase prior (in [-1, 1])
  w_long_ball: 0.0              # Issue #49: D logit lowered on hidden-ball frames of Long Ball / Ball in the Box phases
  w_phase_alive: 0.0            # Issue #43: D logit lowered by this where the ball is hidden in a live phase (0 = off)
  w_phase_hidden: 0.0           # Issue #65: extra phase-prior weight on the H-vs-A odds of hidden-ball frames (0 = off)
  phase_hidden_min_s: 0.0       # ... only in hidden runs of at least this many seconds (0 = every hidden frame)
  auto_calibrate_phase_hidden: false  # Issue #65: label-free weight from phase vs Specialist A's confident visible frames
  phase_hidden_cap: 2.5
  phase_hidden_min_frames: 250
  w_owner: 4.0                  # strong prior from an owning-team ball channel, if the ATD has one
  owner_channels: [owner, owning_team, ball_owner, possession, possessor, team, teamid, team_id, ballowner]
  dead_scale: 1.0               # multiplier of logit(dead_score) when the ball is visible
  dead_scale_no_ball: 0.6       # ... when the ball is missing (the score then rests on player speeds)
  w_status: 3.0                 # extra logit for an alive/dead ATD status channel (+ already in dead_score)
  prob_floor: 0.001             # emission probabilities are floored here (max |log p| = 6.9)
  carry_conf_threshold: 0.35    # |possession_evidence| from which a frame is a confident possession sample
  carry_weight: 1.5             # logit of a fully confident carried team while the ball is missing
  carry_tau_s: 30.0             # e-folding time of the carried confidence
  carry_backward: true          # also carry the NEXT confident team backwards over the gap
  w_touch: 3.0                  # logit of the last toucher's team (decays with touch_tau_s)
  touch_tau_s: 60.0             # e-folding time of the last-touch evidence
  touch_margin_m: 0.5           # distance gap at a touch that gives full weight to its team

# Issue #28 (wave 1) -- end-to-end pipeline switches.  Every stage is optional (progressive fallback).
pipeline:
  use_clean_tracks: true
  use_set_piece_anchors: true   # Smart Tagging -> restart frames t* and forced dead intervals
  use_forced_dead: true         # apply the forced dead intervals of the anchors
  use_phase_prior: true         # Smart Tagging phase prior as a weak H/A prior
  use_owner_channel: true       # ATD owning-team ball channel, if declared
  use_spell_optimizer: true
  alive_exclude_dead_evidence: false   # Issue #43: live-phase mask also drops frames with dead-ball evidence
  alive_dead_threshold: 0.6
  alive_dead_after_s: 3.0
  use_aerial_filter: false      # Issue #12: is_aerial mask suppresses the touches of airborne frames
  use_homography: false         # feed the tactical homographies to the aerial filter (reprojection-jump cue)
  use_native_speed: false       # Issue #42: ATD speed channel (s, km/h) as player-speed fallback at track edges
  native_speed_edge_frames: 3
  isolate_play_blocks: true     # Issue #51: tracking outside the play blocks is masked (no leak across blocks)

# Issue #19 -- realistic degradation of clean external matches (ball occlusion blocks + automatic-tracking
# artefacts).  Used only to build validation / self-supervision data, never on the competition match.
# Issue #38 -- calibrated so that the 7 degraded IDSSE matches reproduce the label-free aggregates of the
# competition ATD (``external_degrader_target`` below, measured with scripts/compare_input_stats.py).
# The Issue #19 behaviour stays reproducible: section external_degrader_legacy below.
external_degrader:
  hide_frac: 0.424                 # share of alive (H/A) frames whose ball is hidden (ball missing ~40.7 % of graded)
  gap_model: lognormal             # lognormal (Issue #38) | classes (Issue #19: dur_edges_s / dur_probs)
  gap_median_s: 12.5               # lognormal block duration: median ...
  gap_sigma: 0.95                  # ... and log-scale spread, clipped to [gap_min_s, gap_max_s]
  gap_min_s: 5.0
  gap_max_s: 240.0
  guard_s: 9.0                     # visible ball kept between two blocks (no merging into longer gaps)
  dur_edges_s: [5.0, 20.0, 60.0, 120.0]   # gap_model classes: [5,20) [20,60) [60,120] seconds
  dur_probs: [0.33, 0.48, 0.19]    # empirical ATD gap mix of the spec
  density_radius_m: 5.0            # players within this distance of the ball define the crowding
  density_floor: 0.25              # added to the mean crowding so empty areas keep some probability
  density_gamma: 1.0               # block weight = (floor + mean crowding) ** gamma
  dead_affinity: 1.0               # Issue #48: block weight x dead_affinity ** (share of D frames in the block); 1 = blind to D
  noise_player_m: 0.12             # i.i.d. Gaussian jitter of every player position
  noise_ball_m: 0.08               # ... and of the visible ball
  noise_corr_s: 0.5                # correlation time of the jitter (AR(1)); 0 = white noise
  cut_rate_per_min: 0.6            # identity cuts per minute of graded time (whole match)
  cut_players: [2, 4]              # same-team players whose slots are permuted at a cut (min, max)
  cut_gap_s: [0.2, 2.0]            # the permuted tracks are lost for this long after the cut
  dup_rate_per_min: 0.3            # duplicate-track episodes per minute
  dup_duration_s: [5.0, 40.0]
  dup_offset_m: 0.4                # offset of the duplicate from the original track
  drop_rate_per_min: 2.4           # single-player dropout episodes per minute
  drop_duration_s: [5.0, 30.0]
  group_drop_rate_per_min: 0.5     # Issue #38: episodes in which several players are lost together
  group_drop_players: [3, 6]
  group_drop_duration_s: [5.0, 20.0]

# Issue #38 -- the Issue #19 degrader profile (merged key by key over external_degrader).  The adopted specialists
# (models/specialists.json) were trained on IDSSE rows degraded with it (specialist_data.degrader_section); the
# evaluation of the external matches uses the calibrated external_degrader.
external_degrader_legacy:
  hide_frac: 0.41
  gap_model: classes
  guard_s: 0.0
  drop_rate_per_min: 0.5
  drop_duration_s: [2.0, 20.0]
  group_drop_rate_per_min: 0.0

# Issue #38 -- aggregates of the competition tactical ATD (BAR-ATH, graded 105.9 min).  Tracking-only, label-free
# statistics printed by scripts/compare_input_stats.py --data-dir data (no labels, no per-frame data); they are the
# calibration target of the degrader above, never a tuning objective for the possession model.
external_degrader_target:
  ball_missing_pct: 40.7
  gaps_per_10min: 12.94
  gap_s_p50_p90_p99: [11.5, 37.9, 113.7]
  hidden_mass_pct_lt5_5to20_20to60_gt60: [0.3, 32.7, 48.0, 19.0]
  players_mean: 20.49
  frames_lt20_players_pct: 14.9

# Issue #17 -- collective physics of each team (goalkeeper-free outfield block).
collective_physics:
  min_players: 4                # fewer valid outfield players -> shape features are NaN
  deriv_span_s: 2.0             # total span of the central difference of areas / centroid
  gk_vel_half_span: 1           # frames each side when velocities are derived from positions

# Issue #18 -- velocity phase coherence, line advance and ball memory (hidden-ball features).
ball_memory:
  min_players: 4                # fewer valid velocities -> coherence / advance are NaN
  smooth_s: 1.0                 # moving average of the team mean v_x
  cap_s: 120.0                  # cap of the time since / until features
  ball_vel_half_span: 2         # frames each side when the ball velocity is derived from positions
  player_vel_half_span: 1
  touch_margin_m: 0.5           # |delta_d| at a touch needed to attribute it to a team
  clear_evidence: 0.35          # |possession_evidence| from which a visible frame is a clear possessor
  pressure_radius_m: 5.0        # radius of the pressure counts

# Issue #22 -- past / future context of the collective signals as extra specialist features: centred means over
# +-W frames and mean(t..t+W) - mean(t-W..t), block-local.  Empty list = off (then the stored model must match).
specialist_features:
  context_windows: [50, 100]
  gk_context: false             # Issue #56: goalkeeper depth + change over +-gk_span frames (off = adopted set)
  gk_span: 150
  carrier_swarm: false          # Issue #64: implicit carrier + 22v22 pressure micro-geometry (off = adopted set)

# Issues #20-#22 -- shared gradient-boosting settings of the learned specialists (LightGBM with a scikit-learn
# HistGradientBoosting fallback).  Generic priors; tuned on external matches only (leave-one-match-out).
specialist_model:
  backend: auto                 # auto = LightGBM if installed, else scikit-learn
  n_estimators: 150
  learning_rate: 0.08
  num_leaves: 15
  min_child_samples: 200
  subsample: 0.8
  colsample: 0.7
  reg_lambda: 5.0
  seed: 0
  calib_folds: 3                # group (match) folds of the temperature calibration; 0 = no calibration
  temperature_bounds: [0.5, 4.0]
  adapt_rounds: 40              # boosting rounds added when adapting to the target match (Issue #21)
  adapt_learning_rate: 0.05

# Issues #20 / #22 -- training rows from the degraded external matches (primary training data).
specialist_data:
  seeds: [0, 1, 2]              # degradation seeds of every external match (Issue #19 degrader)
  stride: 10                    # frames between two rows (0.4 s)
  swap_teams: true              # also train with home / away swapped (team symmetry)
  only_complete_ball: true      # Metrica samples drop the ball while it is dead (leaks D) -> excluded
  min_period_frames: 250
  # Issue #35 -- extra training matches (training rows only; evaluation stays on the degraded IDSSE matches).
  # Prefixes of benchmark files: skillcorner_ (broadcast tracking, already degraded), pff_ (World Cup 2022, ball only
  # where truly visible).  Neither is degraded again.  Measured, see docs/TECHNICAL_REPORT.md 5.x.
  extra_sources: [pff_]         # adopted (Issue #35): IDSSE + the first 20 PFF matches at weight 0.5
  skillcorner_weight: 1.0
  skillcorner_drop_dead: false  # its D is the gap between phases_of_play, not the ball status
  skillcorner_max_matches: 0    # 0 = all, else the first N by name
  pff_weight: 0.5
  pff_max_matches: 20           # 0 = all; the first N by name (deterministic)
  # Issue #38: degrader of the IDSSE training rows.  external_degrader_legacy (Issue #19 profile) = the adopted
  # models; external_degrader = the degrader calibrated to the competition ATD gap statistics (measured, not adopted).
  degrader_section: external_degrader   # Issue #48: calibrated degrader (#38) ...
  dead_affinity: 33.0           # ... with hidden<->dead affinity 33 (realised odds ratio ~18; label-free estimate, see report)
  pff_weight_b: -1.0            # Issue #48: PFF weight of the hidden-ball rows (Specialist B); < 0 = same as pff_weight

# Issue #20 -- Specialist A (ball visible): ultra-confident anchors.
specialist_a:
  anchor_prob: 0.98             # P(winning class) above this ...
  anchor_min_s: 2.0             # ... without interruption for at least this long
  min_train_rows: 2000

# Issue #21 -- block-masking pseudo-labels on the target match itself (algorithmic, from A's anchors).
pseudo_labeling:
  block_min_s: 5.0
  block_max_s: 45.0
  cover_frac: 0.35              # share of the visible graded frames masked per variant
  min_anchor_cover: 0.5         # a block needs this share of anchor frames
  guard_s: 5.0                  # visible distance kept between two blocks
  n_variants: 2
  stride: 10
  weight: 1.0
  max_attempts: 20000
  seed: 0
  min_rows: 300                 # fewer pseudo rows -> no adaptation
  include_dead: true            # keep the anchors labelled D as pseudo-labels

# Issue #22 -- Specialist B (ball absent).
specialist_b:
  min_train_rows: 2000
  adapt: true                   # adapt to the target match with the pseudo-labelled blocks

# Issue #22 -- fusion of A and B into log_probs[N, 3].
specialist_fusion:
  prob_floor: 0.001
  scale_visible: 0.5            # tempering of the log-probabilities (frame correlation); leave-one-match-out
  scale_hidden: 0.5             # on external matches: 1.5 -> 0.594, 1.0 -> 0.600, 0.5 -> 0.606, 0.3 -> 0.608
  blend_visible: 0.0            # weight of the wave-1 heuristic emission (0 = learned only)
  blend_hidden: 0.0
  use_pseudo_labels: false      # Issue #21 adaptation of B; off by default: it did not help on external matches

# Issue #26 / #32 -- MBR consensus over variants of the LEARNED route only (never mixed with the heuristic route):
# each variant scales the emission log-probabilities and shifts transition_matrix.ha_occluded; the variants are
# decoded, merged segment by segment (median boundaries) and then pass through the spell optimiser.
mbr:
  enabled: false
  scales: [0.8, 1.0, 1.25]
  ha_occluded_shifts: [0.0, 0.0, 0.0]
  min_iou: 0.3
  min_support: 0.5

# Issue #15 -- restarting team of Throw-in set pieces tagged Team = N/A (taker on the touchline + first clear
# controller after t*).  Fed into the transition matrix (D -> team bias at t*) and a small emission prior.
throwin_resolver:
  enabled: true
  touchline_band_m: 1.5         # taker candidates stay within this distance of a touchline
  taker_window_s: 3.0           # window before t* inspected for the taker (bounded by the tag start)
  min_band_frac: 0.5            # fraction of a slot's valid frames that must be in the band
  isolation_cap_m: 15.0         # cap of the distance to the nearest opponent
  isolation_sat_m: 6.0          # isolation gap that saturates the taker vote
  taker_ball_radius_m: 3.0      # candidates must hold the ball (median distance); 0 disables, dropped if none pass
  confirm_window_frames: 35     # window after t* for the first clear controller
  control_radius_m: 2.0         # controller within this distance of the ball ...
  control_margin_m: 1.0         # ... and the other team at least this much farther
  control_gap_sat_m: 4.0        # gap that saturates the controller vote
  w_taker: 1.0
  w_controller: 1.0
  min_confidence: 0.3           # below this the throw-in stays unresolved (both columns stay open)
  resolve_known_teams: false    # only Team = N/A throw-ins are resolved
  emission_bias: 0.0            # optional log-bias towards the restart team after t* (0 = off; no gain measured)
  emission_window_s: 2.0

# Issue #12 -- aerial-ball mask from the ball track alone (apparent speed, reprojection jumps, long straight
# flights without grass deceleration, optional ATD height channel).  Generic physical priors.
aerial_filter:
  speed_mps: 35.0               # apparent ground speed above which the ball is airborne
  jump_px: 90.0                 # pixel displacement per frame (with homographies) that is a track jump
  flight_min_speed_mps: 12.0    # a straight flight moves faster than this ...
  straight_deg: 8.0             # ... with a heading change per frame below this ...
  flight_min_length_m: 18.0     # ... over a path at least this long ...
  grass_decel_mps2: 1.5         # ... and a speed slope above -this (rolling on grass loses several m/s per s)
  edge_trim_frames: 3           # kick / landing frames of a flight that are not flagged
  pad_frames: 2                 # growth of the speed / jump cues
  min_run_frames: 2             # flagged runs shorter than this are dropped
  z_min_m: 1.5                  # ball height above which it is airborne (ATD z channel, if declared)
  z_channels: [z, ball_z, height, ballz]

# Issue #11 -- ball recovery from the tactical video (attention crops + detector).  OFF by default until it has
# been validated locally on the real video.  `enabled: true` makes run_pipeline merge the detections cached by
# scripts/run_vision_recovery.py (cache/vision/*.npz); it never reads the video itself.
vision:
  enabled: false
  crop_size: 640
  frame_width: 1920
  frame_height: 1080
  every_k: 5                    # one crop every k frames of each ball-missing gap
  max_crops: 0                  # 0 = no cap
  max_homography_error: 5.0     # frames with a larger reprojection error are not planned
  offscreen_margin_px: 160.0
  interp_max_s: 20.0            # gaps longer than this: search around the nearer seen ball
  pressure_radius_m: 12.0
  pressure_sigma_m: 6.0
  closing_gain_mps: 3.0
  pressure_weight: 0.5          # 0 = pure interpolation, 1 = pressure centroid
  vel_half_span: 2
  detector: hough               # yolo | hough | motion | dryrun
  weights: yolov8n.pt           # public COCO weights downloaded by ultralytics (AGPL-3.0, optional extra yolo)
  confidence: 0.25
  batch_size: 16
  device: ""
  seek_threshold_frames: 250
  hough_min_radius_px: 4
  hough_max_radius_px: 14
  hough_param1: 120.0
  hough_param2: 10.0
  hough_min_brightness: 170.0
  hough_max_candidates: 5
  motion_threshold: 22.0        # Issue #36 detector "motion" (frame triplet t-1,t,t+1; off unless selected)
  ball_diameter_m: 0.22
  motion_size_tolerance: 3.0
  motion_max_candidates: 5
  motion_min_response: 0.1
  motion_blur_sigma: 1.0
  motion_neighbor_penalty: 0.6
  pitch_margin_m: 1.0
  max_search_dist_m: 30.0
  max_speed_mps: 40.0
  speed_slack_m: 1.5
  interp_max_frames: 25         # frames interpolated between two points (at least one a detection)
  cache_dir: cache/vision
  # Issue #66 (not adopted, off): keep a detection only inside a smooth run of consecutive crops; temper the
  # emissions of injected frames (ball_source 2/3).  Defaults change nothing.
  tracklet_gate: false
  tracklet_min_len: 3
  tracklet_max_speed_mps: 35.0
  tracklet_speed_slack_m: 1.0
  tracklet_max_residual_m: 1.0
  tracklet_max_link_frames: 10
  injected_emission_scale: 1.0
  # Issue #67 (off): detections as soft evidence on the H/A emission (nats at confidence 1); 0 = off.
  soft_evidence_weight: 0.0
  soft_evidence_scale_m: 3.0
  soft_evidence_hold_frames: 5

# Issue #10 -- broadcast (TV) tracking synchronised to the tactical clock by continuous blocks; its ball fills
# the tactical holes (ball_source 4).  OFF by default until validated locally on the real broadcast files.
broadcast_sync:
  enabled: false
  min_block_frames: 75          # continuous block = valid homography and reprojection_error < max_reproj_error
  max_block_s: 90.0             # longer shots are split in pieces of at most this length (0 = no split)
  max_reproj_error: 5.0
  pitch_margin_m: 1.0           # players farther outside the pitch are ignored
  min_players: 4                # visible players needed for a fingerprint sample
  speed_half_span: 2
  fingerprint_smooth_s: 1.0
  min_corr: 0.65                # z-normalised cross-correlation of the fingerprints
  min_margin: 0.0               # ... and its lead over the best peak outside margin_excl_s (0 = off; the position
                                # residual below is the real arbiter: the margin rejected as many right as wrong blocks)
  margin_excl_s: 2.0
  max_offset_s: 2400.0          # search window |tactical - broadcast| (0 = unbounded)
  std_floor_rel: 0.1
  refine_s: 3.0                 # position refinement half-width (0 = off)
  refine_step: 5
  refine_max_samples: 80
  max_refine_dist_m: 2.0        # accepted median nearest-same-team distance after the refinement
  max_ball_disagree_m: 3.0      # accepted median ball distance where both balls are visible
  min_ball_overlap: 25
  ball_margin_m: 1.0
  local_rounds: 3               # propagation rounds from the accepted blocks to their neighbours (0 = off)
  local_reach_s: 180.0          # a block is only matched to anchors at most this far away in time
  local_window_s: 60.0          # ... searching offsets within +- this of the nearest anchor's offset
  min_corr_local: 0.5           # relaxed fingerprint correlation inside that narrow window

# Per-route decoder parameters, merged key by key over the sections above (config.route_config).  Tuned with the
# Optuna sweeps of mtah2027-external-benchmarks (reports/optuna_<route>.json): 7 degraded IDSSE matches, seeds 0-1,
# external matches only -- never BAR-ATH.
#  * heuristic: nested leave-one-match-out spellF1 0.396 -> 0.439, unused seed 2 0.384 -> 0.427.
#  * specialists (Issue #31, re-run after the window features of Issue #30): nested +0.0102, unused seed 2
#    0.6326 -> 0.6389; through the real LOMO pipeline (seeds 0-2) 0.6307 -> 0.6415 spellF1, better on every seed.
route_overrides:
  heuristic:
    transition_matrix:
      ha_closed: -15.1775
      ha_open: -2.066
      touch_halfwidth: 7
      touch_min_score: 0.834
      touch_both_dist_m: 2.5684
      require_both_teams: false
      touch_gate_halfwidth: 4
      ha_occluded: -7.6264
      occlusion_min_s: 1.3903
      dead_closed: -4.3176
      dead_open: -3.4803
      d_exit_closed: -7.8084
      d_exit_open: -3.0919
      dead_ramp: [0.1163, 0.3297]
      alive_ramp: [0.3682, 0.856]
    spell_optimizer:
      micro_poss_s: 1.7542
      keep_min_visible_frac: 0.8131
      keep_min_touches: 2
      touch_min_score: 0.8986
      min_dead_s: 0.673
      min_isolated_poss_s: 1.7359
      bridge_min_poss_s: 17.0603
      bridge_min_dead_s: 2.0846
      bridge_dead_threshold: 0.4825
      bridge_requires_geometry: true
    heuristic_emissions:
      w_evidence: 0.1137
      dead_scale: 0.5454
      dead_scale_no_ball: 1.0169
      carry_conf_threshold: 0.1844
      carry_weight: 0.9217
      carry_tau_s: 27.2902
      w_touch: 1.2131
      touch_tau_s: 16.283
  specialists:
    transition_matrix:
      ha_closed: -8.76
      ha_open: -2.5038
      touch_halfwidth: 8
      touch_min_score: 0.7778
      touch_both_dist_m: 1.3128
      require_both_teams: false
      touch_gate_halfwidth: 0
      ha_occluded: -7.5746
      occlusion_min_s: 1.7274
      dead_closed: -11.5876
      dead_open: -1.208
      d_exit_closed: -12.33
      d_exit_open: -1.7022
      dead_ramp: [0.4741, 0.8429]
      alive_ramp: [0.2194, 0.4851]
    spell_optimizer:
      micro_poss_s: 0.9847
      keep_min_visible_frac: 0.3708
      keep_min_touches: 2
      touch_min_score: 0.6957
      min_dead_s: 1.863
      min_isolated_poss_s: 1.2596
      bridge_min_poss_s: 31.6747
      bridge_min_dead_s: 2.8497
      bridge_dead_threshold: 0.5474
      bridge_requires_geometry: false
    specialist_fusion:
      scale_visible: 0.8028
      scale_hidden: 0.8652
      blend_visible: 0.1515
      blend_hidden: 0.0229

# Issue #49 -- restart-team rules of Smart Tagging (goal / half-time rules + tracking vote) and Long Ball occlusion flags.
# Measured on simulated tags (B' IDSSE, A PFF) and left OFF unless the adoption rule is met (docs/TECHNICAL_REPORT.md).
restart_rules:
  enabled: false
  kickoff_after_goal: true      # Kick Off (After Goal) = team that conceded the preceding GOALS tag
  second_half_opposite: true    # second-half Kick Off (Start) = opposite of the first-half one
  tracking_vote: true           # first clear controller after t* votes with the tag
  ctrl_window_s: 1.4
  ctrl_radius_m: 3.0
  ctrl_margin_m: 1.0
  goal_link_s: 150.0
  unreliable_conf: 0.5          # team_conf of a restart whose sources disagree
  fill_unnamed: true
  calibrate_weight: false       # team penalty scaled by the agreement of the tags with Specialist A's confident states
  calib_window_s: 3.0
  calib_prior: 1.0
  long_ball_codes: [long ball, ball in the box]
  auto_long_ball_weight: false  # heuristic_emissions.w_long_ball from Specialist A's confident visible frames
  long_ball_cap: 1.5
  long_ball_min_frames: 250

# Issue #44 -- best decoder / fusion block found by the bounded sweep under the calibrated degrader (B' = 7 IDSSE
# leave-one-match-out at dead_affinity 33, selection seeds 0-1, blind seed 2) together with the ensemble
# `--model-variant ensemble` (models/specialists_ensemble.json = linear mix 0.75 gap + 0.25 mixed).  It gained +0.0091 on
# B'(33) (needed +0.010), so it is NOT applied: copy these sections into route_overrides.specialists to use it.
# Read by nothing; tests/test_44_decoder_ensemble.py checks that every key is a valid parameter.
decoder_candidates:
  issue_44:
    specialist_fusion:
      scale_visible: 0.7
      scale_hidden: 1.0
      blend_visible: 0.1
      blend_hidden: 0.0229
    transition_matrix:
      ha_occluded: -6.0
      ha_closed: -22.0
      ha_open: -2.0
      dead_open: -1.208
      dead_closed: -9.0
      d_exit_open: -3.0
      touch_min_score: 0.7778
    spell_optimizer:
      micro_poss_s: 0.4
      min_dead_s: 2.5
      min_isolated_poss_s: 1.2596
