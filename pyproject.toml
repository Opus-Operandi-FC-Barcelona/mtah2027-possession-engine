[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah2027"
version = "0.1.0"
description = "Deterministic frame-level ball possession engine for More than a Hack 2027 (BAR-ATH)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
fast = ["numba==0.68.0", "lightgbm==4.7.0"]
numba = ["numba==0.68.0"]
lightgbm = ["lightgbm==4.7.0"]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
vision = ["opencv-python-headless==4.13.0.92"]   # Issue #11: read the tactical mp4, Hough fallback detector
yolo = ["opencv-python-headless==4.13.0.92", "ultralytics==8.3.253"]   # + YOLO detector (ultralytics is AGPL-3.0)
crosscheck = ["kloppy==3.18.0"]   # test-only: positions of the EPTS loader are compared with kloppy

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "evaluation"]
addopts = "-p no:cacheprovider"
markers = ["slow: full-length (199,319 frames) performance tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["evaluation", "starter", "games.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
